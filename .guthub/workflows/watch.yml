name: YSSY Departure Watcher

on:
  schedule:
    # Offset by 2 minutes (2,7,12,17...) rather than round numbers
    # (0,5,10...) - GitHub's scheduler gets congested at round times since
    # huge numbers of other workflows fire at exactly those moments, and
    # runs can get silently dropped rather than delayed. Off-beat minutes
    # see far less contention and are more reliably honored.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

# Prevents two runs from overlapping. If a run is still going when the next
# scheduled trigger fires, the new one waits in a queue instead of running
# in parallel - this is what was causing the "rejected push" errors.
concurrency:
  group: yssy-departure-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py

      - name: Save updated cache/state files
        run: |
          git config user.name "yssy-departure-watcher-bot"
          git config user.email "actions@github.com"
          git add icao24_cache.json last_ground_callsign.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update watcher state [skip ci]"

          # Retry the push a few times in case another run's commit landed
          # in between our commit and our push. These two files are just
          # disposable caches the script regenerates each run, so on a
          # conflict we simply keep our (newer) version rather than trying
          # to line-match content - there's nothing meaningful to merge.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, merging latest and retrying ($i/5)..."
            git fetch origin main
            git merge -X ours -m "Merge remote watcher state [skip ci]" origin/main
          done

          echo "Failed to push state after retries."
          exit 1
